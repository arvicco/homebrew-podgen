name: CI

on:
  push:
    branches: [master, "phase-*"]
    paths-ignore:
      - "Formula/**"
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libicu-dev ffmpeg imagemagick espeak-ng

      - name: Gate (syntax + lint + unit + offline integration)
        run: bundle exec rake gate
        env:
          COVERAGE: "1"
